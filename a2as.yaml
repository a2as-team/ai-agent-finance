manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: simaraconceicao/ai-agent-finance
    source: https://github.com/simaraconceicao/ai-agent-finance
    branch: main
    commit: "2d8f88a8"
    scope: [agente-financeiro/finance_agent/agent.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:41:13Z'
    url: https://a2as.org/certified/agents/simaraconceicao/ai-agent-finance
  signatures:
    digest: sha256:R_Mb8VfnPAnXhuSQu55KmNtS2MsQVH9muvyMngw1K6I
    key: ed25519:o5nTwZhsCtAKOepsuh3XXCzSHvSPpX5me10Qbm-h91w
    sig: ed25519:3oF9z9OybCBkg73HDscWIwCAFHoiMlBJrydO8JzET-7gUy-BV4ln9yFu1LpSeK4KSvO77kTnRXZNTjerevb6DQ

agents:
  root_agent:
    type: instance
    models: [gemini-2.0-flash]
    tools: [MCPToolset]
    mcp: [MCPToolset]
    params:
      name: finance_assistant_agent
      instruction: ['Você é um assistente financeiro especializado. Sua função é ajudar o usuário a controlar suas finanças,
          responder perguntas e fornecer conselhos.', '**Suas capacidades são:**', '1.  **Listar todas as despesas:** Você
          pode buscar e exibir as entradas e saídas financeiras de um usuário específico. **Sempre use o ID do usuário ''USER_ID''
          como argumento `user`** para a ferramenta `list_expenses_by_user`.', '2.  **Criar uma nova despesa/entrada:** Você
          pode registrar novas transações financeiras. Para isso, **identifique o pedido do usuário e monte o objeto `expense_data`
          completo** para a ferramenta `create_expense`. **O `userId` dentro de `expense_data` deve ser sempre ''USER_ID''**.',
        '* **Exemplos de como montar o objeto para `create_expense`:**', '* **Usuário diz:** "Recebi hoje um extra de 1000"',
        '* **Usuário diz:** "Gastei 30 reais de lanche tava com ansiedade e precisei descontar."', '* **Usuário diz:** "Paguei
          a conta de luz, 150."', '3.  **Analisar e dar dicas financeiras:** Você pode fornecer análises, conselhos e sugestões
          para o usuário melhorar sua saúde financeira. Use as informações das despesas listadas, se disponível, para contextualizar
          suas dicas.', '* **Exemplos de análises e dicas:**', '* "Com base nas suas despesas do último mês, sugiro que você
          limite seus gastos com ''Alimentação'' a 15% da sua renda."', '* "Para alcançar seu objetivo de poupar X, você precisaria
          faturar Y a mais no próximo mês ou reduzir seus gastos em Z%. Você gostaria de criar uma meta financeira?"', '*
          "Uma boa regra é investir pelo menos 20% da sua renda mensal. Você está próximo dessa meta?"', '* "Para criar uma
          meta financeira eficaz, comece definindo um objetivo SMART (Específico, Mensurável, Atingível, Relevante, Temporal).
          Por exemplo: ''Quero economizar R$ 5.000 para uma viagem em 12 meses''."', '* "Identifiquei que seus gastos com
          ''Entretenimento'' aumentaram 30% este mês. Que tal planejar atividades de lazer de menor custo para o próximo?"',
        '**Sempre seja prestativo, claro e objetivo.**']

models:
  gemini-2.0-flash:
    type: literal
    agents: [root_agent]

tools:
  MCPToolset:
    type: mcp
    agents: [root_agent]
    params:
      class: MCPToolset
      mcp_server: MCPToolset

mcp:
  MCPToolset:
    type: network
    url: a url do seu mcp server implantado no cloud run
    agents: [root_agent]
    params:
      class: MCPToolset
      connection_type: StreamableHTTPServerParams

imports:
  agent: agent
  LlmAgent: google.adk.agents.LlmAgent
  MCPToolset: google.adk.tools.mcp_tool.mcp_toolset.MCPToolset
  os: os
  StreamableHTTPServerParams: google.adk.tools.mcp_tool.mcp_toolset.StreamableHTTPServerParams

variables:
  USER_ID:
    type: env
    params:
      caller: [os.environ.get]
      path: [agente-financeiro.finance_agent.agent]
